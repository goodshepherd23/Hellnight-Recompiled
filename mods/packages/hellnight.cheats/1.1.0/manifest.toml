format_version = 5
id = "hellnight.cheats"
version = "1.1.0"
name = "Hell Night: Dark Messiah Cheats"
author = "goodshepherd23 (codes by DAVIN THE RAVEN and the DuckStation cheat database)"
description = "GameShark-style cheats for Hellnight (Europe), SLES-01562. The first three rewrite a value in the game's memory every frame; the others each change an instruction in the game's code. All are off by default."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLES-01562"

[[feature]]
id = "ok-status"
name = "OK Status"
description = "Keeps the status value at OK (GameShark 800AD840 0000)."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "ok-status"
id = "hellnight.cheat.ok-status"

[[feature]]
id = "infinite-ammo"
name = "Infinite Ammo"
description = "Your companion's ammunition never runs out (GameShark 800ADD54 0001)."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "infinite-ammo"
id = "hellnight.cheat.infinite-ammo"

[[feature]]
id = "companion"
name = "Choose Companion"
description = "Forces which companion follows you (GameShark 800ADD50 000N + 800ADD58 0000). This overrides the story's own choice while it is on, so it can make scenes play out oddly."
group = "Cheats"
default_enabled = false

[[option]]
feature = "companion"
id = "who"
label = "Companion"
description = "Who follows you while this cheat is on."
group = "Cheats"
type = "choice"
default = "naomi"

[[option.choice]]
value = "naomi"
label = "Naomi"

[[option.choice]]
value = "kamiya"
label = "Kamiya"

[[option.choice]]
value = "ivanoff"
label = "Ivanoff"

[[option.choice]]
value = "rene"
label = "Rene"

[[option.choice]]
value = "monster"
label = "The Monster"

[[plugin]]
feature = "companion"
id = "hellnight.cheat.companion"

[[feature]]
id = "full-map"
name = "Show Full Map"
description = "The map shows every area of the current floor, including places you have not visited yet. Turn it on or off here before pressing PLAY."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "full-map"
id = "hellnight.cheat.full-map"

[[feature]]
id = "walk-through-walls"
name = "Walk Through Walls"
description = "Turns off wall collision so you can walk out of bounds. It stays on for the whole session, so you can leave the map or skip past story triggers and get stuck: save first. Turn it on or off here before pressing PLAY."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "walk-through-walls"
id = "hellnight.cheat.walk-through-walls"

[[feature]]
id = "monster-harmless"
name = "The Monster Can't Hurt You"
description = "The monster still chases you but cannot harm you. Turn it on or off here before pressing PLAY."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "monster-harmless"
id = "hellnight.cheat.monster-harmless"
